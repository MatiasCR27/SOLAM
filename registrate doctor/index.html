<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Doctor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <div class="nav-wrapper">
      <div class="logo-title">
        <img src="logo.bg.jpg.jpeg" alt="Logo de SOLAM" class="logo">
        <h1>SOLAM</h1>
      </div>
      <ul id="nav-mobile" class="right hide-on-med-and-down">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="iniciodesesionpersonal.html">Iniciar sesión</a></li>
        <li><a href="registro.html">Registrarse</a></li>
      </ul>
    </div>
  </nav>
    <h1>Registro de Doctor</h1>
    <form action="#" method="post">

        <fieldset>
            <legend>Datos del Doctor</legend>

            <div class="form-row">
                <div class="field-group">
                    <label for="nombre">Nombre completo:</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>
                <div class="field-group">
                    <label for="usuario">Nombre de usuario:</label>
                    <input type="text" id="usuario" name="usuario" required>
                </div>
            </div>

            <div class="form-row">
                <div class="field-group">
                    <label for="email">Correo electrónico:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="field-group">
                    <label for="especialidad">Especialidad médica:</label>
                    <input type="text" id="especialidad" name="especialidad" required>
                </div>
            </div>

            <div class="form-row">
                <div class="field-group">
                    <label for="licencia">Número de licencia profesional:</label>
                    <input type="text" id="licencia" name="licencia" required>
                </div>
                <div class="field-group">
                    <label for="institucion">Hospital o institución:</label>
                    <input type="text" id="institucion" name="institucion" required>
                </div>
            </div>

            <div class="form-row">
                <div class="field-group">
                    <label for="experiencia">Años de experiencia:</label>
                    <input type="number" id="experiencia" name="experiencia" min="0" max="60" required>
                </div>
            </div>

            <div class="form-row">
                <div class="field-group full-width">
                    <label for="telefono">Teléfono:</label>
                    <input type="tel" id="telefono" name="telefono">
                </div>
            </div>
        </fieldset>

        <fieldset>
            <legend>Dirección</legend>

            <div class="form-row">
                <div class="field-group">
                    <label for="pais">País:</label>
                    <input type="text" id="pais" name="pais">
                </div>
                <div class="field-group">
                    <label for="ciudad">Ciudad:</label>
                    <input type="text" id="ciudad" name="ciudad">
                </div>
            </div>

            <div class="form-row">
                <div class="field-group full-width">
                    <label for="direccion">Dirección completa:</label>
                    <input type="text" id="direccion" name="direccion">
                </div>
            </div>
        </fieldset>

        <fieldset>
            <legend>Seguridad</legend>

            <div class="form-row">
                <div class="field-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div class="field-group">
                    <label for="confirmar">Confirmar contraseña:</label>
                    <input type="password" id="confirmar" name="confirmar" required>
                </div>
            </div>
        </fieldset>

        <fieldset>
            <legend>Notificaciones</legend>
            <div class="form-row">
                <div class="field-group">
                    <label>¿Deseas recibir notificaciones?</label>
                </div>
                <div class="field-group">
                    <label>
                        <input type="radio" id="si" name="notificaciones" value="si">
                        Sí
                    </label>
                    <label>
                        <input type="radio" id="no" name="notificaciones" value="no">
                        No
                    </label>
                </div>
            </div>
        </fieldset>


        <fieldset>
            <legend>Comentarios adicionales</legend>

            <div class="form-row">
                <div class="field-group full-width">
                    <label for="comentarios">información adicional:</label>
                    <textarea id="comentarios" name="comentarios" rows="4" cols="40"></textarea>
                </div>
            </div>

            <div class="form-row">
                <div class="field-group full-width">
                    <label for="archivo">Subir foto de perfil:</label>
                    <input type="file" id="archivo" name="archivo">
                </div>
            </div>
        </fieldset>

    
        <fieldset>
            <legend>Términos y condiciones</legend>
            <div class="form-row">
                <div class="field-group">
                    <label>
                        <input type="checkbox" id="terminos" name="terminos" required>
                        Acepto los términos y condiciones
                    </label>
                </div>
                <div class="field-group">
                    <label>
                        <input type="checkbox" id="privacidad" name="privacidad" required>
                        Acepto la política de privacidad
                    </label>
                </div>
            </div>
        </fieldset>

        <button type="submit">Registrarse</button>
        <button type="reset">Limpiar formulario</button>

    </form>

</body>
</html>
